<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>Lone Soulja Admin</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="studio.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body>
  <header class="top">
    <a href="index.html" class="brand"><img src="assets/logo.svg" alt="" width="34" height="34"> LONE SOULJA <span>Admin</span></a>
    <nav class="tabs" id="admin-nav" hidden>
      <a class="tab" href="studio.html">Studio</a>
      <button class="tab" id="refresh" type="button">↻ Refresh</button>
      <button class="tab" id="logout" type="button">Log out</button>
    </nav>
  </header>

  <!-- Login -->
  <main id="login-view" class="login">
    <form id="login-form" class="card">
      <h1>Admin Portal</h1>
      <p class="hint" id="api-info"></p>
      <label>Admin key <input id="login-key" type="password" autocomplete="current-password" required></label>
      <button class="btn gold" type="submit">Log in</button>
      <p class="hint err" id="login-msg" role="alert"></p>
    </form>
  </main>

  <!-- Dashboard -->
  <main id="dash" class="dash" hidden>
    <div class="banner" id="seed-banner" hidden></div>

    <section class="stats">
      <div class="stat"><span>Subscribers</span><strong id="st-subs">–</strong></div>
      <div class="stat"><span>New this week</span><strong id="st-week">–</strong></div>
      <div class="stat"><span>Facebook posts</span><strong id="st-fb">–</strong><small id="st-fb-last"></small></div>
      <div class="stat"><span>Studio fund</span><strong id="st-fund">–</strong>
        <div class="bar"><i id="st-fund-bar"></i></div></div>
    </section>

    <div class="cols">
      <section class="card">
        <h2>Studio Fund</h2>
        <form id="donate-form" class="row">
          <label>Goal ($) <input id="goal" type="number" min="0" step="1" required></label>
          <label>Raised so far ($) <input id="raised" type="number" min="0" step="1" required></label>
          <button class="btn gold" type="submit">Save</button>
        </form>
        <p class="hint" id="donate-msg" role="status"></p>
      </section>

      <section class="card">
        <h2>Quotes <small id="quote-count"></small></h2>
        <p class="hint">One quote per line. These show on the site's "Thought of the Day" and in the Studio.</p>
        <textarea id="quotes" rows="8"></textarea>
        <div class="actions"><button class="btn gold" id="save-quotes" type="button">Save Quotes</button></div>
        <p class="hint" id="quotes-msg" role="status"></p>
      </section>
    </div>

    <section class="card">
      <div class="head">
        <h2>Subscribers</h2>
        <div class="actions">
          <input id="sub-search" type="search" placeholder="Search emails…" aria-label="Search subscribers">
          <button class="btn aqua" id="csv" type="button">Download CSV</button>
        </div>
      </div>
      <div class="table-wrap">
        <table>
          <thead><tr><th>Email</th><th>Signed up</th><th></th></tr></thead>
          <tbody id="subs"></tbody>
        </table>
      </div>
      <p class="hint" id="subs-msg"></p>
    </section>

    <section class="card">
      <h2>Activity</h2>
      <div class="table-wrap">
        <table>
          <thead><tr><th>When</th><th>Event</th><th>Details</th></tr></thead>
          <tbody id="activity"></tbody>
        </table>
      </div>
    </section>
  </main>

  <script src="episodes.js"></script>
  <script src="admin.js"></script>
</body>
</html>
