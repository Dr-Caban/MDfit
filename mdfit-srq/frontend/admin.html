<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex, nofollow">
  <title>MDFIT SRQ Admin</title>
  <link rel="icon" href="assets/logo.svg" type="image/svg+xml">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="admin.css">
</head>
<body class="admin">
  <section id="login" class="login">
    <form id="login-form" class="form" novalidate>
      <a href="/" class="brand dark"><img src="assets/logo.svg" alt="" width="36" height="36"><span>MDFIT SRQ</span></a>
      <h1>Admin</h1>
      <label>Email<input name="email" type="email" required autocomplete="username"></label>
      <label>Password<input name="password" type="password" required autocomplete="current-password"></label>
      <button class="btn" type="submit">Log in</button>
      <p class="form-msg" role="status"></p>
    </form>
  </section>

  <div id="app" hidden>
    <header class="nav">
      <div class="wrap nav-inner">
        <a href="/" class="brand"><img src="assets/logo.svg" alt="" width="32" height="32"><span>MDFIT Admin</span></a>
        <nav class="tabs" role="tablist">
          <button data-tab="dash" aria-selected="true">Dashboard</button>
          <button data-tab="leads">Leads</button>
          <button data-tab="classes">Classes</button>
          <button data-tab="bookings">Bookings</button>
          <button data-tab="subs">Subscribers</button>
          <button data-tab="settings">Settings</button>
          <button id="logout" class="link">Log out</button>
        </nav>
      </div>
    </header>

    <main class="wrap panel-wrap">
      <p id="toast" class="toast" role="status" hidden></p>

      <section data-panel="dash">
        <div class="stats"></div>
        <h2>Next up</h2>
        <div class="table-wrap"><table id="upcoming"></table></div>
      </section>

      <section data-panel="leads" hidden>
        <div class="bar">
          <select id="lead-filter">
            <option value="">All leads</option>
            <option value="new">New</option><option value="contacted">Contacted</option>
            <option value="booked">Booked</option><option value="client">Client</option><option value="closed">Closed</option>
          </select>
          <button class="btn btn-sm btn-line" data-csv="/api/admin/leads.csv">Download CSV</button>
        </div>
        <div id="leads-list" class="stack"></div>
      </section>

      <section data-panel="classes" hidden>
        <form id="class-form" class="form inline-form" novalidate>
          <h2>Add a weekly class</h2>
          <div class="grid4">
            <label>Name<input name="title" required maxlength="80"></label>
            <label>Day<select name="day"></select></label>
            <label>Start<input name="time" type="time" required value="06:00"></label>
            <label>Minutes<input name="durationMin" type="number" min="15" max="240" value="60"></label>
            <label>Capacity<input name="capacity" type="number" min="1" max="100" value="10"></label>
            <label>Coach<input name="coach" maxlength="80"></label>
            <label>Location<input name="location" maxlength="120"></label>
          </div>
          <label>Description<input name="description" maxlength="500"></label>
          <button class="btn btn-sm" type="submit">Add class</button>
          <p class="form-msg" role="status"></p>
        </form>
        <div class="table-wrap"><table id="classes-table"></table></div>
      </section>

      <section data-panel="bookings" hidden>
        <div class="bar"><label class="check"><input type="checkbox" id="bookings-all"> Include past</label></div>
        <div class="table-wrap"><table id="bookings-table"></table></div>
      </section>

      <section data-panel="subs" hidden>
        <div class="bar"><button class="btn btn-sm btn-line" data-csv="/api/admin/subscribers.csv">Download CSV</button></div>
        <div class="table-wrap"><table id="subs-table"></table></div>
      </section>

      <section data-panel="settings" hidden>
        <form id="settings-form" class="form" novalidate>
          <h2>Business</h2>
          <div class="grid2">
            <label>Name<input name="business.name" maxlength="60"></label>
            <label>Tagline<input name="business.tagline" maxlength="160"></label>
            <label>Phone<input name="business.phone" maxlength="30"></label>
            <label>Email<input name="business.email" type="email"></label>
            <label>Address<input name="business.address" maxlength="200"></label>
            <label>Hours<input name="business.hours" maxlength="300" placeholder="Mon-Fri 5am-8pm · Sat 7am-12pm"></label>
            <label>Instagram link<input name="business.instagram" placeholder="https://instagram.com/…"></label>
            <label>Facebook link<input name="business.facebook" placeholder="https://facebook.com/…"></label>
            <label>TikTok link<input name="business.tiktok" placeholder="https://tiktok.com/@…"></label>
            <label>Pricing note<input name="business.bookingNote" maxlength="300" placeholder="Every plan starts with a free consultation."></label>
          </div>
          <h2>Coach</h2>
          <div class="grid2">
            <label>Name<input name="coach.name" maxlength="80"></label>
            <label>Title<input name="coach.title" maxlength="80"></label>
            <label>Photo link<input name="coach.photoUrl" placeholder="https://…/coach.jpg"></label>
          </div>
          <label>Bio (blank line between paragraphs)<textarea name="coach.bio" rows="5" maxlength="3000"></textarea></label>
          <h2>Packages</h2>
          <p class="muted">One per block: <code>Name | Price | Unit</code> on the first line, then one feature per line. Blank line between packages.</p>
          <textarea name="packages" rows="10"></textarea>
          <h2>Testimonials</h2>
          <p class="muted">One per line: <code>Name | Quote</code></p>
          <textarea name="testimonials" rows="5"></textarea>
          <button class="btn" type="submit">Save settings</button>
          <p class="form-msg" role="status"></p>
        </form>
      </section>
    </main>
  </div>

  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
</html>
