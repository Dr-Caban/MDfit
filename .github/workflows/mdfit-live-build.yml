# After a frontend push, checks that mymdfit.com actually serves the new commit (x-mdfit-build header). Fails when
# the domain is attached to a Vercel project that isn't deploying this branch. See mdfit-srq/scripts/check-live-build.js.
name: MDFIT SRQ live site is current

on:
  push:
    branches: ["claude/lone-soulja-podcast-site-2ii8fj"]
    paths: ["mdfit-srq/frontend/**", ".github/workflows/mdfit-live-build.yml"]
  workflow_dispatch:

jobs:
  live-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node mdfit-srq/scripts/check-live-build.js
        env:
          SITE: https://mymdfit.com
          EXPECTED_SHA: ${{ github.sha }}
          WAIT_MINUTES: "6"
